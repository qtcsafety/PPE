<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบเบิกจ่าย PPE</title>
<style>
  html,body{
    margin:0; height:100%; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Sarabun,sans-serif;
    background:#f4faf8; color:#333;
  }
  .box{ text-align:center; padding:24px; }
  .spinner{
    width:40px; height:40px; border:4px solid #d7f0e6; border-top-color:#3fb28f;
    border-radius:50%; margin:0 auto 16px; animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  p{ font-size:14px; color:#666; margin:4px 0; }
  a{ color:#3fb28f; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>กำลังเปิดระบบเบิกจ่าย PPE...</p>
    <p id="fallback" style="display:none;">
      ถ้าหน้าไม่เปิดอัตโนมัติ <a id="fallbackLink" href="#">กดที่นี่</a>
    </p>
  </div>

<script>
  // ***** แก้ตรงนี้ทุกครั้งที่ deploy Apps Script เวอร์ชันใหม่แล้วได้ URL /exec เปลี่ยน *****
  var WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwyxLgCQPpzJCHWigiWH76cW_KSf-IJZ00xcl0iU8bHdQ2k9CKv9I6KWfWUXpPI4CJ1/exec";

  var params = new URLSearchParams(window.location.search);
  var key = params.get('key');

  var target = WEBAPP_URL + (key ? ('?key=' + encodeURIComponent(key)) : '');

  document.getElementById('fallbackLink').href = target;
  document.getElementById('fallback').style.display = 'block';

  // เด้งไปทันที
  window.location.replace(target);
</script>
</body>
</html>
