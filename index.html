<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบเบิกจ่าย PPE</title>
</head>
<body>
<script>
  // ***** แก้ตรงนี้ทุกครั้งที่ deploy Apps Script เวอร์ชันใหม่แล้วได้ URL /exec เปลี่ยน *****
  var WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwyxLgCQPpzJCHWigiWH76cW_KSf-IJZ00xcl0iU8bHdQ2k9CKv9I6KWfWUXpPI4CJ1/exec";

  var params = new URLSearchParams(window.location.search);
  var key = params.get('key');

  var target = WEBAPP_URL + (key ? ('?key=' + encodeURIComponent(key)) : '');

  // เด้งไปหน้าแอปทันที ไม่มีหน้า loading คั่นอีกต่อไป
  // (หน้านี้ถูกเปิดด้วยเบราว์เซอร์ภายนอกอยู่แล้วผ่าน openExternalBrowser=1 จากลิงก์ Telegram
  //  จึงไม่จำเป็นต้องมี fallback สำหรับปัญหา in-app browser เหมือน iframe แบบเดิมอีกแล้ว)
  window.location.replace(target);
</script>
</body>
</html>
